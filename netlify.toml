[build]
  publish = "public"
  functions = "netlify/functions"
  # Inject the real Supabase values into config.js at build time
  command = "sed -i 's|{{SUPABASE_URL}}|'$SUPABASE_URL'|g; s|{{SUPABASE_ANON_KEY}}|'$SUPABASE_ANON_KEY'|g' public/js/config.js"

[functions]
  node_bundler = "esbuild"

[build.environment]
  # Tell the secrets scanner these two keys are intentionally public
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'"
